name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build and run server tests without optional Scale Brews
        run: ./gradlew build runGameTest --no-daemon --console=plain
      - name: Run client GameTests without optional mods
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Fetch optional First Person fixtures
        run: |
          mkdir -p test-libs
          curl --fail --location --output test-libs/firstperson-fabric-2.7.2-mc26.2.jar \
            https://api.modrinth.com/maven/maven/modrinth/H5XMjpHi/6sgz2HEq/H5XMjpHi-6sgz2HEq.jar
          curl --fail --location --output test-libs/notenoughanimations-fabric-1.12.4-mc26.2.jar \
            https://api.modrinth.com/maven/maven/modrinth/MPCX6s5C/67xQnLDS/MPCX6s5C-67xQnLDS.jar
      - name: Run First Person ownership GameTests
        run: xvfb-run -a ./gradlew runClientGameTest -PwithFirstPerson --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Fetch optional Scale Brews runtime fixture
        run: |
          curl --fail --location --output test-libs/scalebrews-0.1.0-beta.5.jar \
            https://github.com/R3Neer/scale-brews/releases/download/v0.1.0-beta.5/scalebrews-0.1.0-beta.5.jar
      - name: Run optional Scale Brews compatibility GameTests
        run: ./gradlew runGameTest -PwithScaleBrews --no-daemon --console=plain
      - name: Run optional Scale Brews client load lane
        run: xvfb-run -a ./gradlew runClientGameTest -PwithScaleBrews --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clinging-reoriented-build
          path: |
            build/libs/*.jar
            build/run/*/logs/latest.log
            build/run/clientGameTest/screenshots/*.png
            build/test-results/**/*.xml
            build/reports/tests/**
            build/reports/problems/**
