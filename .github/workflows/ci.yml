name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Validate English / Spanish localization parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('src/main/resources/assets/clinging_reoriented/lang')
          en = json.loads((root / 'en_us.json').read_text(encoding='utf-8'))
          es = json.loads((root / 'es_es.json').read_text(encoding='utf-8'))
          missing = sorted(set(en) - set(es))
          extra = sorted(set(es) - set(en))
          empty = sorted(k for k in en if not isinstance(es.get(k), str) or not es[k].strip())
          if missing or extra or empty:
              raise SystemExit(f'localization parity failed: missing_es={missing} extra_es={extra} empty_es={empty}')
          print(f'Localization parity OK: {len(en)} keys in en_us and es_es')
          PY
      - name: Build and run unit tests without optional Scale Brews
        run: ./gradlew build --no-daemon --console=plain
      - name: Run server GameTests without optional Scale Brews
        run: ./gradlew runGameTest --no-daemon --console=plain
      - name: Run client GameTests without optional mods
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Preserve default client screenshots
        if: always()
        run: |
          mkdir -p build/default-client-screenshots
          if [ -d build/run/clientGameTest/screenshots ]; then cp -a build/run/clientGameTest/screenshots/. build/default-client-screenshots/; fi
      - name: Fetch optional First Person fixtures
        run: |
          mkdir -p test-libs
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output test-libs/firstperson-fabric-2.7.2-mc26.2.jar \
            https://api.modrinth.com/maven/maven/modrinth/H5XMjpHi/6sgz2HEq/H5XMjpHi-6sgz2HEq.jar
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output test-libs/notenoughanimations-fabric-1.12.4-mc26.2.jar \
            https://api.modrinth.com/maven/maven/modrinth/MPCX6s5C/67xQnLDS/MPCX6s5C-67xQnLDS.jar
      - name: Run First Person ownership GameTests
        run: xvfb-run -a ./gradlew runClientGameTest -PwithFirstPerson --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Preserve First Person screenshots
        if: always()
        run: |
          mkdir -p build/first-person-screenshots
          if [ -d build/run/clientGameTest/screenshots ]; then cp -a build/run/clientGameTest/screenshots/. build/first-person-screenshots/; fi
      - name: Fetch optional Scale Brews runtime fixture
        run: |
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output test-libs/scalebrews-0.1.0-beta.5.jar \
            https://github.com/R3Neer/scale-brews/releases/download/v0.1.0-beta.5/scalebrews-0.1.0-beta.5.jar
      - name: Run optional Scale Brews compatibility GameTests
        run: ./gradlew runGameTest -PwithScaleBrews --no-daemon --console=plain
      - name: Run optional Scale Brews client load lane
        run: xvfb-run -a ./gradlew runClientGameTest -PwithScaleBrews --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Fetch exact VanillaPlus Fresh Animations fixtures
        run: |
          mkdir -p test-libs test-resourcepacks
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output test-libs/entity_model_features-3.3.5-26.2-fabric.jar \
            https://cdn.modrinth.com/data/4I1XuqiY/versions/p8M0c1vN/entity_model_features-3.3.5-26.2-fabric.jar
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output test-libs/entity_texture_features-7.2-26.2-fabric.jar \
            https://cdn.modrinth.com/data/BVzZfTc1/versions/URB7DuXS/entity_texture_features-7.2-26.2-fabric.jar
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output test-resourcepacks/FreshAnimations_v1.10.5.zip \
            https://cdn.modrinth.com/data/50dA9Sha/versions/RGIzA5em/FreshAnimations_v1.10.5.zip
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --output 'test-resourcepacks/FA+Player-v1.1.zip' \
            'https://cdn.modrinth.com/data/TAIMVZCL/versions/Wj7NeGjP/FA%2BPlayer-v1.1.zip'
          echo 'ee598e0703cb15166ed35f93e2d19e69d5bee160721c50ccde2001afecee24470744bd2efe9125e908211e58f60a54074e915f2b726cb6ee70dc3e98f4698c7b  test-libs/entity_model_features-3.3.5-26.2-fabric.jar' | sha512sum -c -
          echo '58da97a72614a41c28d8639fa63a98f775d6a5f101ac30c33213ee63a25b5d41e50c77fc24e269a19e2a54f2dfb4083a8d4e51411eac2ee6efe099e7bf93fa88  test-libs/entity_texture_features-7.2-26.2-fabric.jar' | sha512sum -c -
          echo 'f4f2a1d294c2e0afe245b6987fea4a84ff120f131a7f2cfb16779e9cc5d0a00b3d49bf1585ac827d6690c36421e8dda203b0c6e642bb0c6aa067c5921dd8dc30  test-resourcepacks/FreshAnimations_v1.10.5.zip' | sha512sum -c -
          echo 'd2a5c46ae53e4bb6355604a1ade253ab49f1deb205f5ee69085014965241d3c9623204951ab174a5dbdaf24d9b25ecae9a1638cc6a13d780b398a6d70d157a4e  test-resourcepacks/FA+Player-v1.1.zip' | sha512sum -c -
      - name: Run Fresh Animations Gravity Fall client lane
        run: xvfb-run -a ./gradlew runClientGameTest -PwithFreshAnimations --no-daemon --console=plain
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Preserve Fresh Animations screenshots
        if: always()
        run: |
          mkdir -p build/fresh-animations-screenshots
          if [ -d build/run/clientGameTest/screenshots ]; then cp -a build/run/clientGameTest/screenshots/. build/fresh-animations-screenshots/; fi
      - name: Validate visual snapshot evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct

          roots = {
              'default': Path('build/default-client-screenshots'),
              'first_person': Path('build/first-person-screenshots'),
              'fresh_animations': Path('build/fresh-animations-screenshots'),
          }
          camera = [
              'cam-s01-first-person-past-pole',
              'cam-s01-third-person-past-pole',
              'cam-s05-first-third-continuity',
          ]
          required = {
              'default': [
                  's05-six-turn-retained-camera',
                  's05-gravity-fall-zero-jitter',
                  's05-gravity-fall-velocity-not-gravity',
                  's05-cancelled-landing-holds-partial',
                  's05-language-falling',
                  's05-language-elytra',
                  'gravity-fall-full-sphere-360',
                  *camera,
                  'gravity-charge-inventory-icon',
                  'gravity-charge-first-person-held',
                  'gravity-charge-third-person-held',
                  'gravity-charge-projectile-renderer',
                  'gravity-charge-fixed-3d',
              ],
              'first_person': [
                  'firstperson-gravity-fall-root',
                  'firstperson-gravity-fall-landing',
                  *camera,
              ],
              'fresh_animations': [
                  'fresh-animations-gravity-fall-sustained-down',
                  'fresh-animations-gravity-fall-landing-mid',
                  'fresh-animations-gravity-fall-landing-final',
                  *camera,
              ],
          }
          rows = []
          found = {}
          for lane, names in required.items():
              root = roots[lane]
              for name in names:
                  matches = sorted(root.glob(f'*_{name}.png'))
                  if len(matches) != 1:
                      raise SystemExit(f'{lane}: expected one snapshot for {name}, found {len(matches)}')
                  path = matches[0]
                  data = path.read_bytes()
                  if len(data) < 10000 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                      raise SystemExit(f'{lane}: invalid or implausibly small PNG: {path}')
                  width, height = struct.unpack('>II', data[16:24])
                  if width < 320 or height < 180:
                      raise SystemExit(f'{lane}: snapshot resolution too small: {path} = {width}x{height}')
                  digest = hashlib.sha256(data).hexdigest()
                  found[(lane, name)] = digest
                  rows.append(f'{lane}\t{name}\t{width}x{height}\t{len(data)}\t{digest}\t{path}')

          distinct = [
              (('default', 's05-language-falling'), ('default', 's05-language-elytra')),
              (('fresh_animations', 'fresh-animations-gravity-fall-landing-mid'), ('fresh_animations', 'fresh-animations-gravity-fall-landing-final')),
              (('default', 'cam-s01-first-person-past-pole'), ('default', 'cam-s01-third-person-past-pole')),
              (('default', 'gravity-charge-inventory-icon'), ('default', 'gravity-charge-first-person-held')),
              (('default', 'gravity-charge-first-person-held'), ('default', 'gravity-charge-third-person-held')),
              (('default', 'gravity-charge-third-person-held'), ('default', 'gravity-charge-projectile-renderer')),
              (('default', 'gravity-charge-fixed-3d'), ('default', 'gravity-charge-inventory-icon')),
              (('default', 'gravity-charge-fixed-3d'), ('default', 'gravity-charge-projectile-renderer')),
          ]
          for left, right in distinct:
              if found[left] == found[right]:
                  raise SystemExit(f'semantically distinct snapshots are byte-identical: {left} == {right}')

          text='lane\tcheckpoint\tdimensions\tbytes\tsha256\tpath\n' + '\n'.join(rows) + '\n'
          Path('build/visual-snapshot-manifest.txt').write_text(text, encoding='utf-8')
          Path('build/s05-snapshot-manifest.txt').write_text(text, encoding='utf-8')
          print(text)
          PY
      - name: Upload artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clinging-reoriented-build
          path: |
            build/libs/*.jar
            build/run/*/logs/latest.log
            build/run/clientGameTest/screenshots/*.png
            build/default-client-screenshots/*.png
            build/first-person-screenshots/*.png
            build/fresh-animations-screenshots/*.png
            build/visual-snapshot-manifest.txt
            build/s05-snapshot-manifest.txt
            build/test-results/**/*.xml
            build/reports/tests/**
            build/reports/problems/**
