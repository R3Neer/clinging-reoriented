name: Publish alpha.8 from validated main artifact

on:
  push:
    branches:
      - chatgpt/alpha8-doc-sync
    paths:
      - .github/workflows/release-alpha8.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 725e27a919bca1ff4dbf38434a788a0928ee8336
      VALIDATED_RUN_ID: '34612099166'
      TAG: v0.1.0-alpha.8
      REGULAR_SHA256: 819996434ac2971cd5fc815a354412cadff730a37678e0e417d6b06aa18a703e
      SOURCES_SHA256: 961d51f6eafca91426bd163ca9a32732d034daa8f21082c6a7826d3b628c9da3
    steps:
      - name: Download exact validated main artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATED_RUN_ID}" --jq .head_sha)"
          test "$RUN_SHA" = "$TARGET_SHA"
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name clinging-reoriented-build --dir release-artifact
      - name: Verify release assets
        run: |
          set -euo pipefail
          REGULAR="release-artifact/libs/clinging-reoriented-0.1.0-alpha.8.jar"
          SOURCES="release-artifact/libs/clinging-reoriented-0.1.0-alpha.8-sources.jar"
          test -f "$REGULAR"
          test -f "$SOURCES"
          test "$(stat -c%s "$REGULAR")" = "106915"
          test "$(stat -c%s "$SOURCES")" = "45181"
          test "$(sha256sum "$REGULAR" | cut -d' ' -f1)" = "$REGULAR_SHA256"
          test "$(sha256sum "$SOURCES" | cut -d' ' -f1)" = "$SOURCES_SHA256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          Documentation-sync prerelease for Minecraft 26.2 on Fabric.

          Alpha.8 intentionally makes no gameplay or production-code behavior changes relative to alpha.7. It republishes the alpha.7 hardening implementation with the repository documentation synchronized to the released state.

          - Replaces stale pre-publication candidate/rebuild wording in README and validation docs.
          - Updates current-version references in the guide and compatibility docs to alpha.8.
          - Keeps Scale Brews outside the runtime/support target and retains the separate real-client First Person compatibility lane.
          - Repeats the full 42 server GameTests, 10 JUnit tests, default real-client suites and First Person 2.7.2 + Not Enough Animations 1.12.4 lane on the exact release target.

          Target commit: $TARGET_SHA
          Regular JAR SHA-256: $REGULAR_SHA256
          Sources JAR SHA-256: $SOURCES_SHA256
          EOF
          gh release create "$TAG" \
            release-artifact/libs/clinging-reoriented-0.1.0-alpha.8.jar \
            release-artifact/libs/clinging-reoriented-0.1.0-alpha.8-sources.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Clinging: Reoriented 0.1.0-alpha.8" \
            --notes-file release-notes.md \
            --prerelease
