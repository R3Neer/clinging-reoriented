name: Publish alpha.12

on:
  push:
    branches:
      - tm/water-double-space
    paths:
      - .github/workflows/publish-alpha12.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download validated main artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download 34752659025 \
            --repo "$GITHUB_REPOSITORY" \
            --name clinging-reoriented-build \
            --dir release-artifact
          find release-artifact -type f -print

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="0afa3e528abefb51f9667ea9d7aa1ff466d17509"
          TAG="v0.1.0-alpha.12"
          REGULAR="$(find release-artifact -type f -name 'clinging-reoriented-0.1.0-alpha.12.jar' -print -quit)"
          SOURCES="$(find release-artifact -type f -name 'clinging-reoriented-0.1.0-alpha.12-sources.jar' -print -quit)"
          test -n "$REGULAR"
          test -n "$SOURCES"
          REGULAR_SHA="$(sha256sum "$REGULAR" | awk '{print $1}')"
          SOURCES_SHA="$(sha256sum "$SOURCES" | awk '{print $1}')"

          cat > release-notes.md <<EOF
          Input and tracked-entity polish prerelease for Minecraft 26.2 on Fabric.

          - Keeps Vanilla Space-to-ascend behavior in water; a deliberate second Space rising edge within 250 ms requests Clinging/Reorientation without consuming swimming input.
          - Keeps Clinging recharge tied to real gravity-relative feet support, so water/body contact does not refill the one-turn budget while a real seabed does.
          - Makes the sprint-landing Space reservation jump-power-aware: normal 0.42 keeps alpha.11's one-tick guard, stronger Jump Boost/Leaping-style jumps scale up to a three-tick cap without blanket lockout.
          - Extends Clinging's 180/240 ms quadratic snap presentation to mounts and pets with ID+UUID entity epochs, persisted per-mob sequences and tracking/passenger delivery.
          - Uses one physical rotation for mounted hierarchies; opposite turns take the axis from the rider heading while the root mount receives its own rebased yaw gauge.
          - Advances owned tracked-entity snaps even off-screen, preventing old transitions from replaying when a mob later re-enters view.
          - Keeps unrelated Gravity Changer writes upstream-owned and retains alpha.11's heading continuity, fall segmentation, First Person integration and optional Scale Brews isolation.

          Validation: the exact target commit passed build/JUnit/47 server GameTests, default client GameTests, First Person 2.7.2, optional Scale Brews server compatibility and optional Scale Brews client load on main run #342.

          This remains an alpha prerelease. Longer manual playtesting, multiplayer latency testing and broader full-pack acceptance are still expected before beta.

          Target commit: $TARGET
          Regular JAR SHA-256: $REGULAR_SHA
          Sources JAR SHA-256: $SOURCES_SHA
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi

          gh release create "$TAG" \
            "$REGULAR" "$SOURCES" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Clinging: Reoriented 0.1.0-alpha.12" \
            --notes-file release-notes.md \
            --prerelease
