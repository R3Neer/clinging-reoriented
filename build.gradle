plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = mod_version
group = 'io.github.r3neer'
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }

def withFirstPerson = providers.gradleProperty('withFirstPerson').isPresent()
def withScaleBrews = providers.gradleProperty('withScaleBrews').isPresent()
def withFreshAnimations = providers.gradleProperty('withFreshAnimations').isPresent()

dependencies {
    if (withFirstPerson) runtimeOnly fileTree(dir: 'test-libs', include: ['firstperson*.jar', 'notenoughanimations*.jar'])
    if (withScaleBrews) runtimeOnly fileTree(dir: 'test-libs', include: 'scalebrews-*.jar')
    if (withFreshAnimations) runtimeOnly fileTree(dir: 'test-libs', include: ['entity_model_features*.jar', 'entity_texture_features*.jar'])
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation file('libs/gravity.jar').exists() ? files('libs/gravity.jar') : 'maven.modrinth:gravity-changer-unofficial-port:vpktEkWn'
    implementation file('libs/alexsmobs.jar').exists() ? files('libs/alexsmobs.jar') : 'maven.modrinth:alexs-mobs-continued:fL9nXI68'
    implementation file('libs/codxlib-1.5.1-fabric+26.2.jar').exists() ? files('libs/codxlib-1.5.1-fabric+26.2.jar') : 'maven.modrinth:codxlib:BwANM3tR'
    implementation file('libs/cloth-config-26.2.155.jar').exists() ? files('libs/cloth-config-26.2.155.jar') : 'maven.modrinth:cloth-config:Nv3xnWXd'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
processResources { inputs.property 'version', version; filesMatching('fabric.mod.json') { expand version: project.version } }
fabricApi { configureTests { createSourceSet = true; modId = 'clinging_reoriented_test'; enableGameTests = true; enableClientGameTests = true } }

dependencies {
    if (withFirstPerson) gametestCompileOnly fileTree(dir: 'test-libs', include: ['firstperson*.jar', 'notenoughanimations*.jar'])
}
if (!withFirstPerson) sourceSets.gametest.java.exclude '**/FirstPersonChecks.java'

// Client GameTest's run directory is recreated by Loom before the launch task. Copy the exact
// VanillaPlus Fresh Animations resource-pack fixtures in doFirst, after that cleanup has happened.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (withFreshAnimations) doFirst {
        copy {
            from 'test-resourcepacks'
            into layout.buildDirectory.dir('run/clientGameTest/resourcepacks').get().asFile
        }
    }
}

tasks.register('verifyScaleCompileIsolation') {
    doLast {
        def leaked = configurations.compileClasspath.files.findAll {
            def normalized = it.name.toLowerCase(java.util.Locale.ROOT).replace('-', '').replace('_', '')
            normalized.contains('scalebrews')
        }
        if (!leaked.empty) throw new GradleException("Scale Brews leaked into production compileClasspath: ${leaked*.name.join(', ')}")
    }
}
tasks.named('compileJava').configure { dependsOn tasks.named('verifyScaleCompileIsolation') }

tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
